<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>습관 트래커</title>
<link rel="icon" href="data:,">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; }
  @keyframes popBounce {
    0% { transform: scale(0) translateY(30px); opacity: 0; }
    50% { transform: scale(1.2) translateY(-14px); opacity: 1; }
    65% { transform: scale(0.95) translateY(0px); }
    80% { transform: scale(1.08) translateY(-8px); }
    100% { transform: scale(1) translateY(0px); }
  }
  @keyframes fadeUp {
    0% { opacity: 0; transform: translateY(8px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes badgeIn {
    0% { opacity: 0; transform: scale(0.6); }
    100% { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/lucide-react@0.383.0/dist/umd/lucide-react.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;
const { Plus, X, Check } = LucideReact;

const STAR_SPRITE = ['00100', '01110', '11111', '01110', '10001'];

function PixelSprite({ unit = 6, color }) {
  return (
    <div style={{ display: 'grid', gridTemplateColumns: `repeat(5, ${unit}px)`, gridTemplateRows: `repeat(5, ${unit}px)` }}>
      {STAR_SPRITE.flatMap((row, r) =>
        row.split('').map((c, cIdx) => (
          <div key={`${r}-${cIdx}`} style={{ width: unit, height: unit, background: c === '1' ? color : 'transparent' }} />
        ))
      )}
    </div>
  );
}

const DEFAULT_HABITS = [
  { id: 1, name: '아침 스트레칭', target: 21, completed: 8, checkedToday: false },
  { id: 2, name: '독서 20분', target: 30, completed: 14, checkedToday: false },
  { id: 3, name: '물 2L 마시기', target: 66, completed: 22, checkedToday: false },
];

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function HabitTracker() {
  const [habits, setHabits] = useState([]);
  const [showForm, setShowForm] = useState(false);
  const [newName, setNewName] = useState('');
  const [newTarget, setNewTarget] = useState('30');
  const [celebrationStage, setCelebrationStage] = useState('idle');
  const [loading, setLoading] = useState(true);
  const [initialized, setInitialized] = useState(false);

  const colors = {
    bg: '#F6F4EF', surface: '#FFFFFF', border: '#E7E2D8',
    text: '#2A2825', textSoft: '#8C8579', accent: '#5B4FE8', accentSoft: '#ECEAFB',
  };

  useEffect(() => {
    let loadedHabits = DEFAULT_HABITS;
    try {
      const raw = localStorage.getItem('habit-data');
      if (raw) {
        const data = JSON.parse(raw);
        loadedHabits = data.date === todayKey() ? data.habits : data.habits.map(h => ({ ...h, checkedToday: false }));
      }
    } catch (e) {}
    const loadedAllDone = loadedHabits.length > 0 && loadedHabits.every(h => h.checkedToday);
    setHabits(loadedHabits);
    setCelebrationStage(loadedAllDone ? 'badge' : 'idle');
    setInitialized(true);
    setLoading(false);
  }, []);

  useEffect(() => {
    if (!initialized) return;
    try { localStorage.setItem('habit-data', JSON.stringify({ date: todayKey(), habits })); } catch (e) {}
  }, [habits, initialized]);

  const toggleToday = (id) => {
    setHabits(prev => prev.map(h => {
      if (h.id !== id) return h;
      const checkedToday = !h.checkedToday;
      const completed = checkedToday ? Math.min(h.completed + 1, h.target) : Math.max(h.completed - 1, 0);
      return { ...h, checkedToday, completed };
    }));
  };

  const removeHabit = (id) => setHabits(prev => prev.filter(h => h.id !== id));

  const addHabit = () => {
    if (!newName.trim()) return;
    const target = Math.max(parseInt(newTarget) || 30, 1);
    setHabits(prev => [...prev, { id: Date.now(), name: newName.trim(), target, completed: 0, checkedToday: false }]);
    setNewName(''); setNewTarget('30'); setShowForm(false);
  };

  const doneToday = habits.filter(h => h.checkedToday).length;
  const allDone = habits.length > 0 && doneToday === habits.length;

  useEffect(() => {
    if (!initialized) return;
    if (allDone) setCelebrationStage(prev => (prev === 'idle' ? 'popup' : prev));
    else setCelebrationStage('idle');
  }, [allDone, initialized]);

  useEffect(() => {
    if (celebrationStage === 'popup') {
      const t = setTimeout(() => setCelebrationStage('badge'), 1600);
      return () => clearTimeout(t);
    }
  }, [celebrationStage]);

  if (loading) {
    return <div style={{ minHeight: '100vh', background: colors.bg, display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: "'Silkscreen', monospace", color: colors.textSoft, fontSize: 12 }}>LOADING...</div>;
  }

  return (
    <div style={{ minHeight: '100vh', background: colors.bg, display: 'flex', justifyContent: 'center', alignItems: 'flex-start', padding: '40px 16px', fontFamily: "'Noto Sans KR', sans-serif" }}>
      <div style={{ width: 380, maxWidth: '100%', background: colors.surface, borderRadius: 36, border: `1px solid ${colors.border}`, boxShadow: '0 20px 60px -20px rgba(42,40,37,0.25)', overflow: 'hidden', position: 'relative' }}>

        {celebrationStage === 'popup' && (
          <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', background: 'rgba(246,244,239,0.94)', zIndex: 20 }}>
            <div style={{ animation: 'popBounce 1.1s ease-out' }}><PixelSprite unit={12} color={colors.accent} /></div>
            <div style={{ marginTop: 18, fontFamily: "'Silkscreen', monospace", fontSize: 15, color: colors.text, animation: 'fadeUp 0.4s ease-out 0.5s both' }}>오늘 목표 달성!</div>
          </div>
        )}

        {celebrationStage === 'badge' && (
          <div style={{ position: 'absolute', top: 20, right: 20, zIndex: 15, display: 'flex', alignItems: 'center', gap: 6, background: colors.accent, color: '#fff', borderRadius: 999, padding: '5px 10px 5px 8px', animation: 'badgeIn 0.35s ease-out' }}>
            <PixelSprite unit={3} color="#fff" />
            <span style={{ fontFamily: "'Silkscreen', monospace", fontSize: 10 }}>DONE</span>
          </div>
        )}

        <div style={{ padding: '28px 24px 20px' }}>
          <div style={{ fontFamily: "'Silkscreen', monospace", fontSize: 11, letterSpacing: 2, color: colors.accent, marginBottom: 10 }}>HABIT TRACKER</div>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end' }}>
            <div>
              <div style={{ fontSize: 20, fontWeight: 600, color: colors.text }}>
                {new Date().toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' })}
              </div>
              <div style={{ fontSize: 13, color: colors.textSoft, marginTop: 2 }}>오늘 완료한 습관</div>
            </div>
            <div style={{ fontFamily: "'Silkscreen', monospace", fontSize: 28, color: colors.text }}>
              {doneToday}<span style={{ color: colors.textSoft, fontSize: 18 }}>/{habits.length}</span>
            </div>
          </div>
          <div style={{ display: 'flex', gap: 6, marginTop: 14 }}>
            {habits.map(h => (
              <div key={h.id} style={{ flex: 1, height: 6, borderRadius: 3, background: h.checkedToday ? colors.accent : colors.border }} />
            ))}
          </div>
        </div>

        <div style={{ padding: '4px 16px 16px', display: 'flex', flexDirection: 'column', gap: 10 }}>
          {habits.map(h => {
            const segFilled = Math.min(10, Math.round((h.completed / h.target) * 10));
            return (
              <div key={h.id} style={{ background: colors.accentSoft, borderRadius: 20, padding: '14px 16px' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                  <button onClick={() => toggleToday(h.id)} style={{
                    width: 28, height: 28, borderRadius: 8, border: `2px solid ${h.checkedToday ? colors.accent : colors.border}`,
                    background: h.checkedToday ? colors.accent : colors.surface, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, cursor: 'pointer',
                  }}>
                    {h.checkedToday && <Check size={16} color="#fff" strokeWidth={3} />}
                  </button>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 15, fontWeight: 600, color: colors.text, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{h.name}</div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 6 }}>
                      <div style={{ display: 'flex', gap: 2 }}>
                        {Array.from({ length: 10 }).map((_, i) => (
                          <div key={i} style={{ width: 8, height: 8, borderRadius: 2, background: i < segFilled ? colors.accent : colors.border }} />
                        ))}
                      </div>
                      <div style={{ fontFamily: "'Silkscreen', monospace", fontSize: 11, color: colors.textSoft }}>{h.completed}/{h.target}일</div>
                    </div>
                  </div>
                  <button onClick={() => removeHabit(h.id)} style={{ color: colors.textSoft, background: 'transparent', border: 'none', cursor: 'pointer', padding: 4 }}>
                    <X size={16} />
                  </button>
                </div>
              </div>
            );
          })}
          {habits.length === 0 && (
            <div style={{ textAlign: 'center', padding: '32px 0', color: colors.textSoft, fontSize: 13 }}>첫 습관을 추가해보세요</div>
          )}
        </div>

        <div style={{ padding: '0 16px 24px' }}>
          {showForm ? (
            <div style={{ background: colors.surface, border: `1px solid ${colors.border}`, borderRadius: 20, padding: 16 }}>
              <input value={newName} onChange={e => setNewName(e.target.value)} placeholder="습관 이름" style={{ width: '100%', border: 'none', outline: 'none', fontSize: 15, color: colors.text, marginBottom: 10, background: 'transparent' }} autoFocus />
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 14 }}>
                <span style={{ fontSize: 13, color: colors.textSoft }}>목표 일수</span>
                <input type="number" value={newTarget} onChange={e => setNewTarget(e.target.value)} style={{ width: 60, border: `1px solid ${colors.border}`, borderRadius: 8, padding: '4px 8px', fontSize: 13, color: colors.text }} />
                <span style={{ fontSize: 13, color: colors.textSoft }}>일</span>
              </div>
              <div style={{ display: 'flex', gap: 8 }}>
                <button onClick={addHabit} style={{ flex: 1, background: colors.accent, color: '#fff', border: 'none', borderRadius: 12, padding: '10px 0', fontSize: 14, fontWeight: 600, cursor: 'pointer' }}>추가</button>
                <button onClick={() => setShowForm(false)} style={{ padding: '10px 16px', background: 'transparent', border: 'none', color: colors.textSoft, fontSize: 14, cursor: 'pointer' }}>취소</button>
              </div>
            </div>
          ) : (
            <button onClick={() => setShowForm(true)} style={{
              width: '100%', border: `1.5px dashed ${colors.border}`, borderRadius: 20, padding: '14px 0',
              display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, color: colors.textSoft, background: 'transparent', cursor: 'pointer', fontSize: 14,
            }}>
              <Plus size={16} /> 새 습관 추가
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<HabitTracker />);
</script>
</body>
</html>
